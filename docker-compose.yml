services:
  app1:
    build: .
    environment:
      VCF_DATA_DIR: /data
      VCF_INSTANCE_ID: app1
    volumes:
      - vcfdata:/data
    ports:
      - "8001:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/version').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10

  app2:
    build: .
    environment:
      VCF_DATA_DIR: /data
      VCF_INSTANCE_ID: app2
    volumes:
      - vcfdata:/data
    ports:
      - "8002:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/version').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vcfdata:
